<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#050d24">

  <script>
    try {
      var theme = JSON.parse(localStorage.getItem("astromed-theme"));
      if (theme !== "light" && theme !== "dark") {
        theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.dataset.theme = theme;
    } catch (error) {
      document.documentElement.dataset.theme = "dark";
    }
  </script>

  <title>AstroMed · Space Medical Assistant</title>

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
</head>

<body>
  <div id="app"></div>

  <script type="module" src="/src/main.jsx"></script>

  <!-- Prebuilt bundle without source (PDF report). Deferred so it runs after the module entry. -->
  <script defer src="/legacy/astromed-pro.js"></script>
</body>

</html>
